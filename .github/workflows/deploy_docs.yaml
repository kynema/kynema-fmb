name: Deploy Kynema-FMB Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{github.ref}}-${{github.head_ref}}-docs
  cancel-in-progress: true

jobs:
  Deploy-Docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Cache install Dependencies
        id: cache-dependencies
        uses: actions/cache@v3
        with:
          path: ${{ runner.workspace }}/spack
          key: linux-spack_v7-openblas-0.3.33
          restore-keys: linux-spack_v7
      - name: Install Dependencies
        run: |
          if [ ! -f "${{runner.workspace}}/spack/share/spack/setup-env.sh" ]; then
            git clone --depth 1 https://github.com/spack/spack.git ${{runner.workspace}}/spack
          fi
          source ${{runner.workspace}}/spack/share/spack/setup-env.sh
          spack compiler find
          spack external find
          spack install --only dependencies 'kynema-fmb+klu+rosco+superlu~superlu-mt+tests+umfpack ^openblas@=0.3.33'
          source .github/workflows/setup-json-dependency.sh
          setup_json_dependency
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libenchant-2-dev
          python3 -m pip install --upgrade pip
          pip install -r docs/requirements.txt
      - name: Build Kynema-FMB with documentation
        run: |
          source ${{runner.workspace}}/spack/share/spack/setup-env.sh
          spack load eigen kokkos-kernels yaml-cpp netcdf-c suite-sparse superlu
          cmake -B ${{runner.workspace}}/build \
            -DKYNEMA_FMB_ENABLE_TESTS=OFF \
            -DKYNEMA_FMB_ENABLE_DOCUMENTATION=ON \
            -DKYNEMA_FMB_ENABLE_KLU=ON \
            -DKYNEMA_FMB_ENABLE_UMFPACK=ON \
            -DKYNEMA_FMB_ENABLE_SUPERLU=ON \
            -DCMAKE_BUILD_TYPE=Release \
            ${{github.workspace}}
          cmake --build ${{runner.workspace}}/build
      - name: Deploy documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.workspace }}/build/docs/sphinx/html
