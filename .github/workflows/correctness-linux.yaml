name: Kynema-FMB Unit and Regression Testing on Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  Correctness-Linux:
    runs-on: ubuntu-24.04
    env:
      SPACK_SPEC: "kynema-fmb+klu+rosco+superlu~superlu-mt+tests+umfpack"
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 2
      CXX: ${{matrix.compiler}}
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Release, Debug]
        build_external: [all, none]
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Cache install Dependencies
        id: cache-dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.workspace }}/spack
            ${{ runner.workspace }}/spack-packages
          key: linux-spack_v8-${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.build_external }}
          restore-keys: |
            linux-spack_v8-${{ runner.os }}-${{ matrix.compiler }}-
            linux-spack_v8-${{ runner.os }}-
      - name: Install Dependencies
        run: |
          sudo apt-get update
          if [ ! -f "${{runner.workspace}}/spack/share/spack/setup-env.sh" ]; then
            git clone --depth 1 https://github.com/spack/spack.git ${{runner.workspace}}/spack
          fi
          source ${{runner.workspace}}/spack/share/spack/setup-env.sh
          spack compiler find
          spack external find
          spack install --only dependencies "${SPACK_SPEC}"
      - name: Configure Kynema-FMB
        run: |
          source ${{runner.workspace}}/spack/share/spack/setup-env.sh
          spack build-env "${SPACK_SPEC}" cmake -B ${{runner.workspace}}/build \
            -DKYNEMA_FMB_ENABLE_SANITIZER_ADDRESS=${{ matrix.build_external == 'none' }} \
            -DKYNEMA_FMB_ENABLE_SANITIZER_LEAK=${{ matrix.build_external == 'none' }} \
            -DKYNEMA_FMB_ENABLE_SANITIZER_UNDEFINED=${{ matrix.build_external == 'none' }} \
            -DKYNEMA_FMB_ENABLE_CPPCHECK=OFF \
            -DKYNEMA_FMB_ENABLE_CLANG_TIDY=ON \
            -DKYNEMA_FMB_WARNINGS_AS_ERRORS=OFF \
            -DKYNEMA_FMB_ENABLE_OPENFAST_ADI=OFF \
            -DKYNEMA_FMB_ENABLE_ROSCO_CONTROLLER=${{ matrix.build_external == 'all' }} \
            -DKYNEMA_FMB_ENABLE_KLU=ON \
            -DKYNEMA_FMB_ENABLE_UMFPACK=ON \
            -DKYNEMA_FMB_ENABLE_SUPERLU=ON \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{github.workspace}}
      - name: Build Kynema-FMB
        run: |
          source ${{runner.workspace}}/spack/share/spack/setup-env.sh
          spack build-env "${SPACK_SPEC}" cmake --build ${{runner.workspace}}/build
      - name: Test Kynema-FMB
        run: |
          source ${{runner.workspace}}/spack/share/spack/setup-env.sh
          spack build-env "${SPACK_SPEC}" ctest --test-dir ${{runner.workspace}}/build --output-on-failure --extra-verbose
