name: Kynema-FMB Unit and Regression Testing on MacOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  Correctness-MacOS:
    runs-on: macos-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 2
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Release, Debug]
        build_external: [all, none]
    steps:
      - name: Cache install Dependencies
        id: cache-dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.workspace }}/spack
            ${{ runner.workspace }}/spack-packages
          key: macos-spack_v7
      - name: Install Dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/spack/spack.git ${{runner.workspace}}/spack
          source ${{runner.workspace}}/spack/share/spack/setup-env.sh
          spack compiler find
          spack external find
          spack install cppcheck
          spack install --only dependencies kynema-fmb+klu+rosco+superlu+superlu-mt+tests+umfpack ^superlu-mt cflags="-std=gnu17"
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Configure Kynema-FMB
        run: |
          source ${{runner.workspace}}/spack/share/spack/setup-env.sh
          spack build-env kynema-fmb cmake -B ${{runner.workspace}}/build \
            -DKYNEMA_FMB_ENABLE_SANITIZER_ADDRESS=${{ matrix.build_external == 'none' }} \
            -DKYNEMA_FMB_ENABLE_SANITIZER_UNDEFINED=${{ matrix.build_external == 'none' }} \
            -DKYNEMA_FMB_ENABLE_CPPCHECK=ON \
            -DKYNEMA_FMB_ENABLE_CLANG_TIDY=ON \
            -DKYNEMA_FMB_WRITE_OUTPUTS=ON \
            -DKYNEMA_FMB_WARNINGS_AS_ERRORS=OFF \
            -DKYNEMA_FMB_ENABLE_OPENFAST_ADI=OFF \
            -DKYNEMA_FMB_ENABLE_ROSCO_CONTROLLER=${{ matrix.build_external == 'all' }} \
            -DKYNEMA_FMB_ENABLE_KLU=ON \
            -DKYNEMA_FMB_ENABLE_UMFPACK=ON \
            -DKYNEMA_FMB_ENABLE_SUPERLU=ON \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{github.workspace}}
      - name: Build Kynema-FMB
        run: |
          source ${{runner.workspace}}/spack/share/spack/setup-env.sh
          spack build-env kynema-fmb cmake --build ${{runner.workspace}}/build
      - name: Test Kynema-FMB
        run: |
          source ${{runner.workspace}}/spack/share/spack/setup-env.sh
          spack build-env kynema-fmb ctest --test-dir ${{runner.workspack}}/build --output-on-failure --extra-verbose
