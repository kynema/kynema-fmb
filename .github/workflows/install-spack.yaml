name: Kynema-FMB Installation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Correctness-Linux:
    runs-on: ubuntu-24.04
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 2
      CXX: g++
      CC: gcc
    steps:
      - uses: actions/checkout@v6
        with:
          path: kynema-fmb
          submodules: recursive
      - name: Install Kynema-FMB
        run: |
          git clone https://github.com/spack/spack.git
          source spack/share/spack/setup-env.sh
          spack compiler find
          source kynema-fmb/.github/workflows/setup-json-dependency.sh
          setup_json_dependency
          spack env create -d .
          spack env activate .
          spack add kynema-fmb ^netcdf-c~mpi ^hdf5~mpi
          spack develop --no-clone --path kynema-fmb kynema-fmb@main
          spack concretize -f
          spack install
      - name: Rigid Body and Springs Test
        run: |
          source spack/share/spack/setup-env.sh
          spack env activate .
          cd kynema-fmb/tests/documentation_tests/floating_platform
          mkdir build
          cd build
          spack build-env kynema-fmb -- bash
          cmake ../ -DCMAKE_BUILD_TYPE=Debug
          make -j 2
          ./floating_platform
      - name: IEA15MW Turbine Test
        run: |
          source spack/share/spack/setup-env.sh
          spack env activate .
          cd kynema-fmb/tests/documentation_tests/iea15mw_turbine
          mkdir build
          cd build
          spack build-env kynema-fmb -- bash
          cmake ../ -DCMAKE_BUILD_TYPE=Debug
          make -j 2
          cp ../IEA-15-240-RWT.yaml ./
          ./iea15mw_turbine
      - name: Heavy Top
        run: |
          source spack/share/spack/setup-env.sh
          spack env activate .
          cd kynema-fmb/tests/documentation_tests/heavy_top
          mkdir build
          cd build
          spack build-env kynema-fmb -- bash
          cmake ../ -DCMAKE_BUILD_TYPE=Debug
          make -j 2
          ./heavy_top
      - name: Spring Mass System
        run: |
          source spack/share/spack/setup-env.sh
          spack env activate .
          cd kynema-fmb/tests/documentation_tests/spring_mass_system
          mkdir build
          cd build
          spack build-env kynema-fmb -- bash
          cmake ../ -DCMAKE_BUILD_TYPE=Debug
          make -j 2
          ./spring_mass_system
      - name: Three Blade Rotor
        run: |
          source spack/share/spack/setup-env.sh
          spack env activate .
          cd kynema-fmb/tests/documentation_tests/three_blade_rotor
          mkdir build
          cd build
          spack build-env kynema-fmb -- bash
          cmake ../ -DCMAKE_BUILD_TYPE=Debug
          make -j 2
          ./three_blade_rotor
